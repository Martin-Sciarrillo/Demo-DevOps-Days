[project]
name = "devopsdays-foundryiq-demo"
version = "1.0.0"
description = "DevOps Days demo: Multi-agent orchestration with Microsoft Agent Framework SDK and Azure Foundry IQ Agentic Retrieval"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Martin Sciarrillo", email = "martin.sciarrillo@microsoft.com" }
]
keywords = ["azure", "agent-framework", "foundry-iq", "devops", "multi-agent"]

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
